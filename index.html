<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mini Bagan Adventure V1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bb9c7;font:14px system-ui;color:white;touch-action:none}canvas{display:block}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.panel{background:#101a2bdd;border:1px solid #ffffff40;border-radius:12px;padding:8px 12px}#joy{position:fixed;left:24px;bottom:28px;width:126px;height:126px;border:2px solid #ffffff70;border-radius:50%;background:#101a2b88;touch-action:none}#stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#e7c58a;border:2px solid white}#actions{position:fixed;right:20px;bottom:28px;display:flex;flex-direction:column;gap:10px}button{width:72px;height:58px;border-radius:16px;background:#101a2b;color:white;border:1px solid #ffffff70;font-weight:bold;touch-action:none}#start{position:fixed;inset:0;display:grid;place-items:center;background:#101a2bd9;text-align:center;padding:24px}#start div{background:#142238;padding:24px;border-radius:18px;max-width:400px}#start button{background:#d7ad70;color:#24180e;width:auto;padding:0 20px}#message{position:fixed;left:50%;bottom:165px;transform:translateX(-50%);background:#101a2bdd;padding:8px 12px;border-radius:16px;white-space:nowrap}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body>
<div id="hud"><div class="panel"><b>MINI BAGAN ADVENTURE</b><div>Synthetic demo world</div></div><div class="panel" id="coords">X 0 · Z 0 · -- FPS</div></div><div id="joy"><div id="stick"></div></div><div id="actions"><button id="run">RUN</button><button id="talk">TALK</button></div><div id="message">Explore the pagoda courtyard</div><div id="start"><div><h2>Mini Bagan Adventure V1</h2><p>Three.js player prototype. Synthetic Bagan-inspired test world, not live map data.</p><button id="begin">START ADVENTURE</button></div></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb9c7);scene.fog=new THREE.Fog(0x9bb9c7,40,130);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,300);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffedcf,0x59634b,2));const sun=new THREE.DirectionalLight(0xffe4bd,2);sun.position.set(-30,50,20);scene.add(sun);const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),material(0xb6a078));floor.rotation.x=-Math.PI/2;floor.position.y=-.1;scene.add(floor);
const player=new THREE.Group();scene.add(player);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),material(0x315b73));torso.position.y=1.05;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),material(0xd9a77d));head.position.y=1.83;player.add(head);player.position.set(0,0,16);const obstacles=[];function pagoda(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);[[new THREE.CylinderGeometry(3.4,4,.8,8),0x9b6b45,.4],[new THREE.CylinderGeometry(2.8,3.2,1,8),0xd4b37a,1.2],[new THREE.CylinderGeometry(1,1.8,2,8),0xe0c48b,2.7],[new THREE.ConeGeometry(.8,3,8),0x9b5e32,5.2]].forEach(([geo,c,y])=>{const m=new THREE.Mesh(geo,material(c));m.position.y=y;g.add(m)});obstacles.push({x,z,r:4.5*s})}pagoda(-14,-20,1.1);pagoda(15,-38,.9);pagoda(22,4,.7);
for(let i=0;i<20;i++){const x=(Math.random()-.5)*90,z=(Math.random()-.5)*100-10;if(Math.abs(x)<8&&Math.abs(z-16)<10)continue;const tree=new THREE.Group();tree.position.set(x,0,z);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2.2,6),material(0x705038));trunk.position.y=1.1;tree.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.4,8,7),material(0x657b4d));crown.position.y=2.8;tree.add(crown);scene.add(tree);obstacles.push({x,z,r:1.2})}
const npc=new THREE.Group();npc.position.set(5,0,-4);scene.add(npc);const npcBody=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.75,4,8),material(0x9b6538));npcBody.position.y=.95;npc.add(npcBody);const npcHead=new THREE.Mesh(new THREE.SphereGeometry(.29,12,10),material(0xd8a47b));npcHead.position.y=1.72;npc.add(npcHead);
let joy={x:0,y:0},running=false,started=false,yaw=0,last=performance.now(),frames=0,acc=0,fps=0,drag=null;const pad=document.querySelector('#joy'),stick=document.querySelector('#stick');let pointer=null;function moveStick(e){const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.34,len=Math.hypot(dx,dy)||1,k=Math.min(1,max/len);joy={x:dx*k/max,y:dy*k/max};stick.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}pad.addEventListener('pointerdown',e=>{pointer=e.pointerId;pad.setPointerCapture(pointer);moveStick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pointer)moveStick(e)});function release(e){if(e.pointerId===pointer){pointer=null;joy={x:0,y:0};stick.style.transform='translate(0,0)'}}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);const run=document.querySelector('#run');run.addEventListener('pointerdown',e=>{e.preventDefault();running=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>run.addEventListener(ev,()=>running=false));document.querySelector('#talk').onclick=()=>document.querySelector('#message').textContent=player.position.distanceTo(npc.position)<5?'NPC: Mingalaba! Welcome to Bagan.':'Move closer to the guide to talk.';
function update(dt){const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),v=forward.multiplyScalar(-joy.y).add(right.multiplyScalar(joy.x));if(v.lengthSq()>.01){v.normalize();const next=player.position.clone().addScaledVector(v,(running?8:4.2)*dt);if(!obstacles.some(o=>Math.hypot(next.x-o.x,next.z-o.z)<o.r+.65))player.position.copy(next);player.rotation.y=Math.atan2(v.x,v.z)}const target=new THREE.Vector3(player.position.x+Math.sin(yaw)*10,8,player.position.z+Math.cos(yaw)*10);camera.position.lerp(target,.09);camera.lookAt(player.position.x,1,player.position.z);document.querySelector('#coords').textContent='X '+player.position.x.toFixed(1)+' · Z '+player.position.z.toFixed(1)+' · '+fps+' FPS'}renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<170&&e.clientY>innerHeight-190)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.006;drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);function animate(now){const dt=Math.min((now-last)/1000,.04);last=now;frames++;acc+=dt;if(acc>.5){fps=Math.round(frames/acc);frames=0;acc=0}if(started)update(dt);renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);document.querySelector('#begin').onclick=()=>{started=true;document.querySelector('#start').style.display='none';document.querySelector('#message').textContent='Explore. Avoid pagodas and trees.'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
